services:
  web:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-lab}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-squad_lab}
      DB_USER: ${DB_USER:-squad_lab}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-squad_lab}
      MYSQL_USER: ${DB_USER:-squad_lab}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - squad_db:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  squad_db:
